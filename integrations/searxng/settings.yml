use_default_settings: true

search:
  formats:
    - html
    - json

server:
  secret_key: 'temporary-key-please-change-me'
  bind_address: '0.0.0.0'
  port: 8080
  limiter: false
  public_instance: false

engines:
  - name: bing
    engine: bing
    shortcut: bi
    disabled: false
    headers:
      User-Agent: 'Mozilla/5.0 AppleWebKit/537.36 Chrome/125 Safari/537.36'
  - name: baidu
    baidu_category: general
    categories: [general]
    engine: baidu
    shortcut: bd
    disabled: false
  - name: sogou
    engine: sogou
    shortcut: sogou
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
